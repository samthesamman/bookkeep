# All secrets come from a local .env file (gitignored). Copy .env.example to
# .env and fill it in. Never put real tokens/passwords in this file.

services:
  app:
    image: book-hound:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Set GEOCITIES_MODE=true in .env for the retro 90s reskin, then rebuild.
        GEOCITIES_MODE: ${GEOCITIES_MODE:-false}
    container_name: book-hound
    # Run as the same uid/gid that owns the CIFS mounts below.
    user: "1031:65538"
    environment:
      DATABASE_URL: postgresql://bookhound:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/bookhound_db
      HARDCOVER_API_TOKEN: ${HARDCOVER_API_TOKEN:-}
      NYT_BOOKS_API_KEY: ${NYT_BOOKS_API_KEY:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      GOOGLE_BOOKS_COUNTRY: ${GOOGLE_BOOKS_COUNTRY:-US}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      BOOKKEEP_SECRET_KEY: ${BOOKKEEP_SECRET_KEY:?set BOOKKEEP_SECRET_KEY in .env}
    volumes:
    #   # Mount host download directories so Bookkeep can access completed downloads.
    #   # Adjust the left side (host path) to match your download client's output directory.
    #   - /path/to/downloads:/downloads
    #   # Example: separate mounts for different media types
      - cifs-cloud-audiobooks:/data/torrents/audiobooks/managed/
      - cifs-cloud-calibre-dbs:/calibre
      - cifs-cloud-data:/data
    ports:
      # Bind to loopback only. Put a TLS reverse proxy (Caddy/Traefik/nginx) in
      # front of this; do not expose 8000 directly to the LAN or internet.
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
      - redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16-alpine
    container_name: book-hound-db
    environment:
      POSTGRES_DB: bookhound_db
      POSTGRES_USER: bookhound
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # No host port: only the app container needs the database, over the internal
    # Docker network. Uncomment (loopback-bound) only for local admin access.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: book-hound-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--save", "60", "1"]
    # No host port: only the app container needs Redis.
    # ports:
    #   - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Optional: FlareSolverr for Cloudflare bypass (used by direct downloads)
  # Uncomment to enable. Set the URL in Direct Download Settings to http://flaresolverr:8191
  # flaresolverr:
  #   image: ghcr.io/flaresolverr/flaresolverr:latest
  #   container_name: book-hound-flaresolverr
  #   environment:
  #     LOG_LEVEL: info
  #   ports:
  #     - "8191:8191"
  #   restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  cifs-cloud-books:
    driver_opts:
      type: "cifs"
      o: "username=${SMB_USER},password=${SMB_PASSWORD},uid=1031,gid=65538,vers=3.0"
      device: //10.102.1.11/data/torrents/books/unmanaged/
  cifs-cloud-audiobooks:
    driver_opts:
      type: "cifs"
      o: "username=${SMB_USER},password=${SMB_PASSWORD},uid=1031,gid=65538,vers=3.0"
      device: //10.102.1.11/data/torrents/audiobooks/managed/
  cifs-cloud-calibre-dbs:
    driver_opts:
      type: "cifs"
      o: "username=${SMB_RO_USER},password=${SMB_RO_PASSWORD},nobrl,uid=1031,gid=65538,vers=3.0"
      device: //10.102.1.11/data/media/books/
  cifs-cloud-data:
    driver_opts:
      type: "cifs"
      o: "username=${SMB_USER},password=${SMB_PASSWORD},uid=1031,gid=65538,vers=3.0"
      device: //10.102.1.11/data/
